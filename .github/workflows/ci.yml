name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate TOML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all TOML files parse
        run: python3 scripts/validate.py

      - name: Check for duplicate provider IDs
        run: |
          python3 -c "
          import tomllib
          from pathlib import Path
          seen = set()
          dupes = []
          for path in sorted(Path('dist').glob('*.toml')):
              with path.open('rb') as f:
                  data = tomllib.load(f)
              pid = data.get('id')
              if pid in seen:
                  dupes.append(pid)
              seen.add(pid)
          if dupes:
              print(f'DUPLICATE IDs: {dupes}')
              exit(1)
          print(f'OK: {len(seen)} unique provider IDs')
          "